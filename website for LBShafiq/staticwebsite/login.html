<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন | JobQBank</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind_Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- অ্যাম্বিয়েন্ট লাইটিং ইফেক্ট -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600/10 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-emerald-600/10 rounded-full blur-[100px] pointer-events-none"></div>
    
    <div class="w-full max-w-md bg-white/[0.03] border border-white/10 backdrop-blur-xl rounded-3xl p-8 shadow-2xl relative z-10">
        <!-- হেডার/লোগো -->
        <div class="text-center mb-8">
            <span class="text-2xl font-black text-white tracking-tight flex items-center justify-center gap-2 mb-2">
                <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-graduation-cap text-white text-xs"></i>
                </div>
                <span>Job<span class="text-emerald-500">QBank</span></span>
            </span>
            <h2 class="text-xl font-bold text-slate-200">ফিরে আসার জন্য ধন্যবাদ!</h2>
            <p class="text-xs text-slate-400 mt-1">আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>

        <!-- ফর্ম -->
        <form class="space-y-5" action="dashboard.html">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">ইমেইল বা ফোন নম্বর</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500"><i class="fa-regular fa-envelope text-sm"></i></span>
                    <input type="text" placeholder="example@email.com" class="w-full bg-white/[0.02] border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" required>
                </div>
            </div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-300">পাসওয়ার্ড</label>
                    <a href="#" class="text-[11px] text-blue-400 hover:underline">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500"><i class="fa-solid fa-lock text-sm"></i></span>
                    <input type="password" placeholder="••••••••" class="w-full bg-white/[0.02] border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" required>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-sm transition-colors shadow-lg shadow-blue-600/20 transform hover:-translate-y-0.5 active:translate-y-0">লগইন করুন</button>
        </form>

        <div class="mt-8 pt-6 border-t border-white/5 text-center">
            <p class="text-xs text-slate-400">নতুন ইউজার? <a href="register.html" class="text-emerald-400 font-bold hover:underline ml-1">নতুন অ্যাকাউন্ট তৈরি করুন</a></p>
        </div>
    </div>
</body>
</html>
