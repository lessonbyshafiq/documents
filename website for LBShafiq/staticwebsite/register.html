<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নিবন্ধন | JobQBank</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link class="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind_Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- অ্যাম্বিয়েন্ট লাইটিং ইফেক্ট -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-emerald-600/10 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-600/10 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-md bg-white/[0.03] border border-white/10 backdrop-blur-xl rounded-3xl p-8 shadow-2xl relative z-10">
        <!-- হেডার/লোগো -->
        <div class="text-center mb-6">
            <span class="text-2xl font-black text-white tracking-tight flex items-center justify-center gap-2 mb-2">
                <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-graduation-cap text-white text-xs"></i>
                </div>
                <span>Job<span class="text-emerald-500">QBank</span></span>
            </span>
            <h2 class="text-xl font-bold text-slate-200">ফ্রি অ্যাকাউন্ট তৈরি করুন</h2>
            <p class="text-xs text-slate-400 mt-1">আজই শুরু করুন আপনার চাকরি প্রস্তুতি</p>
        </div>

        <!-- ফর্ম -->
        <form class="space-y-4" action="dashboard.html">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">আপনার নাম</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500"><i class="fa-regular fa-user text-sm"></i></span>
                    <input type="text" placeholder="মোঃ আল-আমিন" class="w-full bg-white/[0.02] border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" required>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">ইমেইল ঠিকানা</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500"><i class="fa-regular fa-envelope text-sm"></i></span>
                    <input type="email" placeholder="name@example.com" class="w-full bg-white/[0.02] border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" required>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">পাসওয়ার্ড</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500"><i class="fa-solid fa-lock text-sm"></i></span>
                    <input type="password" placeholder="নূন্যতম ৬ ডিজিট" class="w-full bg-white/[0.02] border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors" required>
                </div>
            </div>
            
            <div class="flex items-start pt-1">
                <input type="checkbox" id="terms" class="mt-0.5 rounded border-white/10 bg-white/5 text-blue-600 focus:ring-0" required>
                <label for="terms" class="text-[11px] text-slate-400 ml-2 leading-relaxed">আমি প্ল্যাটফর্মের সমস্ত <a href="#" class="text-blue-400 hover:underline">শর্তাবলী</a> এবং <a href="#" class="text-blue-400 hover:underline">প্রাইভেসি পলিসি</a> মেনে নিচ্ছি।</label>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm transition-colors shadow-lg shadow-emerald-600/20 transform hover:-translate-y-0.5 mt-2">নিবন্ধন সম্পন্ন করুন</button>
        </form>

        <div class="mt-6 pt-5 border-t border-white/5 text-center">
            <p class="text-xs text-slate-400">ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="login.html" class="text-blue-400 font-bold hover:underline ml-1">লগইন করুন</a></p>
        </div>
    </div>
</body>
</html>
